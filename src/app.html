<!doctype html>
<html lang="en" class="h-full bg-slate-50 text-slate-900 antialiased">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0F172A" />
		<title>AKOKA • Campus Price Intelligence & Protected Transactions (UNILAG)</title>

		<!-- Clean Typography: Plus Jakarta Sans -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		<!-- Tailwind CDN configured with bespoke Akoka design token system -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						fontFamily: {
							sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
							mono: ['"JetBrains Mono"', 'monospace']
						},
						colors: {
							akoka: {
								50: '#F0F9FF',
								100: '#E0F2FE',
								200: '#BAE6FD',
								300: '#7DD3FC',
								400: '#38BDF8',
								500: '#0284C7',
								600: '#0369A1',
								700: '#075985',
								800: '#0C4A6E',
								900: '#082F49',
								950: '#041B2D'
							},
							lagos: {
								navy: '#0B132B',
								dark: '#1C2541',
								slate: '#3A506B',
								accent: '#5BC0BE'
							},
							trust: {
								50: '#ECFDF5',
								100: '#D1FAE5',
								500: '#10B981',
								600: '#059669',
								700: '#047857'
							},
							amberCampus: {
								50: '#FFFBEB',
								100: '#FEF3C7',
								500: '#F59E0B',
								600: '#D97706',
								700: '#B45309'
							}
						},
						boxShadow: {
							card: '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
							subtle: '0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04)',
							elevated: '0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04)',
							floating: '0 20px 35px -8px rgba(15, 23, 42, 0.12)'
						}
					}
				}
			};
		</script>
		%sveltekit.head%
	</head>
	<body class="h-full bg-slate-50 text-slate-800 font-sans selection:bg-akoka-500 selection:text-white" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
